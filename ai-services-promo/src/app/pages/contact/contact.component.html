<section class="page-header">
  <h1>Contact Us</h1>
  <p>Get in touch and let's build something amazing together</p>
</section>
<section class="contact-container">
  @if (!submitted) {
    <form class="contact-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" [(ngModel)]="formData.name" name="name" required placeholder="Your name" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="formData.email" name="email" required placeholder="your@email.com" />
      </div>
      <div class="form-group">
        <label for="company">Company</label>
        <input type="text" id="company" [(ngModel)]="formData.company" name="company" placeholder="Your company" />
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" [(ngModel)]="formData.message" name="message" rows="5" required placeholder="How can we help?"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
  } @else {
    <div class="success-message">
      <span class="success-icon">✅</span>
      <h2>Thank you!</h2>
      <p>Your message has been sent. We'll get back to you within 24 hours.</p>
    </div>
  }
</section>
