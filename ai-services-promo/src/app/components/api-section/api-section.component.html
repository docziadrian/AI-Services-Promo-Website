<section class="api-section" [class.api-section-reverse]="section.reversed">
  <div class="api-content">
    @if (section.reversed) {
      <div class="api-text">
        <h2>{{ section.title }}</h2>
        <p>{{ section.description }}</p>
      </div>
      <div class="api-image">
        <img [src]="section.image" [alt]="section.imageAlt" />
      </div>
    } @else {
      <div class="api-image">
        <img [src]="section.image" [alt]="section.imageAlt" />
      </div>
      <div class="api-text">
        <h2>{{ section.title }}</h2>
        <p>{{ section.description }}</p>
      </div>
    }
  </div>
</section>
